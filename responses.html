<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Form Responses - FormAI" />
    <meta property="og:description" content="View all responses to your AI-generated forms" />
    <title>Form Responses - FormAI</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(135deg, #ff9a9e 0%, #ff6b9d 25%, #c9184a 50%, #ff69b4 75%, #ff8cc8 100%);
        background-attachment: fixed;
        min-height: 100vh;
        color: white;
      }
      
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }
      
      .header {
        text-align: center;
        margin-bottom: 40px;
        padding: 30px 0;
      }
      
      .header h1 {
        font-size: 3rem;
        font-weight: bold;
        background: linear-gradient(45deg, #00ff88, #ff00ff, #00ccff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-fill-color: transparent;
        margin-bottom: 10px;
        text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
      }
      
      .header p {
        font-size: 1.2rem;
        opacity: 0.8;
        margin-bottom: 20px;
      }
      
      .forms-selector {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
        justify-content: center;
        flex-wrap: wrap;
      }
      
      .form-selector button {
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .form-selector button:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }
      
      .form-selector button.active {
        background: linear-gradient(45deg, #00ff88, #ff00ff);
        border-color: rgba(0, 255, 136, 0.5);
      }
      
      .responses-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        gap: 25px;
        margin-bottom: 40px;
      }
      
      .response-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 25px;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      
      .response-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
        z-index: -1;
      }
      
      .response-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0, 255, 255, 0.3);
      }
      
      .form-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 15px;
        color: #00ff88;
      }
      
      .form-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 0.9rem;
        opacity: 0.7;
      }
      
      .response-count {
        background: linear-gradient(45deg, #ff00ff, #00ccff);
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: bold;
      }
      
      .form-date {
        color: #ff8cc8;
      }
      
      .responses-list {
        max-height: 500px;
        overflow-y: auto;
        margin-top: 20px;
      }
      
      .response-item {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        border-left: 3px solid #00ff88;
      }
      
      .response-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-weight: bold;
        font-size: 0.9rem;
      }
      
      .response-id {
        color: #ff00ff;
      }
      
      .response-date {
        color: #ff8cc8;
        font-size: 0.8rem;
      }
      
      .no-responses {
        text-align: center;
        padding: 60px 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        border: 2px dashed rgba(255, 255, 255, 0.2);
        margin: 40px 0;
      }
      
      .no-responses h2 {
        font-size: 2rem;
        margin-bottom: 15px;
        opacity: 0.8;
      }
      
      .no-responses p {
        font-size: 1.1rem;
        opacity: 0.6;
        margin-bottom: 20px;
      }
      
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(45deg, #00ff88, #ff00ff);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
      }
      
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 255, 136, 0.4);
      }
      
      .loading {
        text-align: center;
        padding: 40px;
        font-size: 1.2rem;
        opacity: 0.7;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #00ff88;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Theme toggle */
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50px;
        padding: 8px 16px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }
      
      /* Dark mode */
      body.dark {
        background: linear-gradient(135deg, #2d1b69 0%, #0f0e17 25%, #1a1a2e 50%, #16213e 75%, #0f0f23 100%);
      }
      
      body.dark .response-card {
        background: rgba(0, 0, 0, 0.2);
        border-color: rgba(255, 255, 255, 0.1);
      }
      
      body.dark .response-card:hover {
        box-shadow: 0 20px 40px rgba(0, 255, 255, 0.1);
      }
      
      body.dark .no-responses {
        background: rgba(0, 0, 0, 0.1);
        border-color: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
    </div>
    
    <div class="container">
      <header class="header">
        <h1>✨ Form Responses</h1>
        <p>View all responses to your AI-generated magical forms</p>
      </header>
      
      <div id="forms-selector" class="forms-selector">
        <!-- Forms will be populated here -->
      </div>
      
      <div id="responses-container">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading magical responses...</p>
        </div>
      </div>
    </div>
    
    <script>
      let isDark = localStorage.getItem('theme') === 'dark';
      let currentFormId = null;
      let allForms = [];
      let allResponses = {};
      
      function setTheme(dark) {
        if (dark) {
          document.body.classList.add('dark');
          document.getElementById('theme-icon').textContent = '☀️';
        } else {
          document.body.classList.remove('dark');
          document.getElementById('theme-icon').textContent = '🌙';
        }
        localStorage.setItem('theme', dark ? 'dark' : 'light');
        isDark = dark;
      }
      
      function toggleTheme() {
        setTheme(!isDark);
      }
      
      // Initialize theme
      setTheme(isDark);
      
      // Fetch all forms
      async function fetchAllForms() {
        try {
          const response = await fetch('/api/forms');
          if (!response.ok) {
            throw new Error('Failed to fetch forms');
          }
          
          allForms = await response.json();
          populateFormsSelector();
        } catch (error) {
          console.error('Error fetching forms:', error);
          document.getElementById('forms-selector').innerHTML = `
            <div style="color: #ff6b6b; text-align: center; padding: 20px;">
              <h2>❌ Error Loading Forms</h2>
              <p>Unable to load forms. Please refresh the page.</p>
            </div>
          `;
        }
      }
      
      // Populate forms selector
      function populateFormsSelector() {
        const selector = document.getElementById('forms-selector');
        
        if (allForms.length === 0) {
          selector.innerHTML = `
            <div style="text-align: center; padding: 40px; background: rgba(255,255,255,0.05); border-radius: 16px; border: 2px dashed rgba(255,255,255,0.2);">
              <h2 style="margin-bottom: 15px; opacity: 0.8;">📝 No Forms Created Yet</h2>
              <p style="font-size: 1.1rem; opacity: 0.6; margin-bottom: 20px;">Start creating magical forms with AI to see them here!</p>
              <a href="/builder" class="btn">Create Your First Form</a>
            </div>
          `;
          return;
        }
        
        const buttonsHtml = allForms.map(form => `
          <button onclick="selectForm('${form.id}')" ${currentFormId === form.id ? 'class="active"' : ''}>
            ${form.title}
            </button>
        `).join('');
        
        selector.innerHTML = buttonsHtml;
        
        // Auto-select first form if none selected
        if (!currentFormId && allForms.length > 0) {
          selectForm(allForms[0].id);
        }
      }
      
      // Select a form and load its responses
      async function selectForm(formId) {
        currentFormId = formId;
        populateFormsSelector();
        
        // Update active button state
        const buttons = document.querySelectorAll('#forms-selector button');
        buttons.forEach(btn => {
          btn.classList.remove('active');
          if (btn.onclick.toString().includes(formId)) {
            btn.classList.add('active');
          }
        });
        
        // Load responses for selected form
        await loadFormResponses(formId);
      }
      
      // Load responses for a specific form
      async function loadFormResponses(formId) {
        const container = document.getElementById('responses-container');
        container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading responses...</p></div>';
        
        try {
          const [formRes, responsesRes] = await Promise.all([
            fetch(`/api/forms/${formId}`),
            fetch(`/api/forms/${formId}/responses`)
          ]);
          
          if (!formRes.ok || !responsesRes.ok) {
            throw new Error('Failed to load form data');
          }
          
          const form = await formRes.json();
          const responses = await responsesRes.json();
          
          allResponses[formId] = responses;
          displayResponses(form, responses);
          
        } catch (error) {
          console.error('Error loading responses:', error);
          container.innerHTML = `
            <div class="no-responses">
              <h2>❌ Error Loading Responses</h2>
              <p>Unable to load responses for this form. Please try again.</p>
              <button class="btn" onclick="selectForm('${formId}')">Retry</button>
            </div>
          `;
        }
      }
      
      // Display responses
      function displayResponses(form, responses) {
        const container = document.getElementById('responses-container');
        
        if (!responses || responses.length === 0) {
          container.innerHTML = `
            <div class="no-responses">
              <h2>📝 No Responses Yet</h2>
              <p>This form hasn't received any magical responses yet. Share it to start collecting data!</p>
              <a href="/form/${form.id}" target="_blank" class="btn">View Form</a>
            </div>
          `;
          return;
        }
        
        const responsesHtml = responses.map((response, index) => `
          <div class="response-card" onclick="viewResponse('${form.id}', '${response.id}')">
            <div class="form-title">${form.title}</div>
            <div class="form-meta">
              <span class="response-count">Response #${index + 1}</span>
              <span class="form-date">${new Date(response.submitted_at).toLocaleDateString()}</span>
            </div>
            <div class="responses-list">
              ${Object.entries(response.answers).map(([fieldId, answer]) => {
                const field = form.fields.find(f => f.id === fieldId);
                if (!field) return '';
                
                return `
                  <div class="response-item">
                    <div class="response-header">
                      <span>${field.label}</span>
                      <span class="response-id">ID: ${response.id.slice(0, 8)}...</span>
                    </div>
                    <div>${answer}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `).join('');
        
        container.innerHTML = responsesHtml;
      }
      
      // View individual response
      function viewResponse(formId, responseId) {
        window.open(`/form-results.html?form=${formId}&response=${responseId}`, '_blank');
      }
      
      // Initialize
      fetchAllForms();
    </script>
  </body>
</html>
